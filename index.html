<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Struktur Organisasi SMAN 15 Bandung</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.75)),url('background.png') center top/cover no-repeat #f3fbf7;color:#173b2c}

.wrap{padding:28px}.head{text-align:center;margin-bottom:24px}.head h1{margin:0;font-size:28px}.head p{margin:7px 0;color:#6c8178}.chart{width:1200px;margin:0 auto;position:relative;transform-origin:top left}#fit{width:100%;overflow:hidden}
.top{position:relative;display:grid;grid-template-columns:1fr 170px 1fr;align-items:start}
.headcard{position:relative;align-self:stretch;grid-column:2}.headcard:after{content:"";position:absolute;left:50%;top:0;bottom:-34px;border-left:2px solid #82aa98;z-index:0}
.card{background:#fff;border:1px solid #d7e8df;border-radius:18px;box-shadow:0 8px 24px #174b2b14;padding:12px;text-align:center;width:170px;position:relative;z-index:2}
.photo{display:block;width:100%;aspect-ratio:3/4;border-radius:12px;object-fit:cover;object-position:center 20%;background:#e6f3ec;border:2px solid #cde6d8}
.role{font-size:12px;color:#668077;margin-top:8px}.name{font-weight:800;margin-top:3px;word-break:break-word}
.korlas{grid-column:3;justify-self:start;margin-left:120px}
.dash{position:absolute;left:calc(50% + 85px);top:110px;width:120px;border-top:2px dashed #7aa890}
.waka-row{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;position:relative;padding-top:34px}.waka-row:before{content:"";position:absolute;left:10%;right:10%;top:0;border-top:2px solid #82aa98}
.dept{position:relative;text-align:center}.dept:before{content:"";position:absolute;top:-34px;left:50%;height:34px;border-left:2px solid #82aa98}
.dept>.card{margin:0 auto}
.staff{margin-top:42px;display:flex;flex-direction:column;gap:10px;align-items:center;position:relative}.staff:before{content:"";position:absolute;top:-42px;bottom:-5px;border-left:2px solid #82aa98;z-index:0}
.staff .card,.wali .card{width:150px}.staff .photo,.wali .photo{aspect-ratio:4/5}
.wali-title{text-align:center;margin:42px 0 16px}.wali{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;justify-items:center}
.loading{text-align:center;padding:60px;color:#6c8178}.err{max-width:700px;margin:40px auto;padding:20px;border-radius:14px;background:#fff1f1;color:#8b3131}
@media(max-width:800px){.wrap{padding:14px}.head h1{font-size:22px}}

#adminView{background:#f3faf6;min-height:100vh}

.awrap{max-width:1100px;margin:auto;padding:24px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:20px}.panel{background:#fff;border:1px solid #dcebe3;border-radius:18px;padding:20px;box-shadow:0 8px 25px #174b2b12;margin-bottom:18px}h1{margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.item{border:1px solid #e0ebe6;border-radius:14px;padding:14px}.item strong{display:block;margin-bottom:8px}.row{display:flex;gap:8px}.row input[type=text]{flex:1;padding:10px;border:1px solid #ccdcd4;border-radius:9px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#287a55;color:#fff;cursor:pointer;font-weight:700}.btn.secondary{background:#e7f1ec;color:#24563f}.btn.danger{background:#a63d3d}.status{padding:12px;border-radius:10px;background:#edf7f1;margin-bottom:15px}.login{max-width:420px;margin:80px auto}.hidden{display:none}.small{font-size:12px;color:#71857c}.actions{display:flex;gap:8px;flex-wrap:wrap}.file{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.awrap{padding:14px}}

</style></head><body>
<div id="publicView"><div class="wrap"><div class="head"><h1>STRUKTUR ORGANISASI SMAN 15 BANDUNG</h1><p>Informasi diperbarui secara online</p></div><div id="app" class="loading">Memuat struktur organisasi…</div></div></div>
<div id="adminView" class="hidden"><div class="awrap"><div id="login" class="panel login"><h1>🔐 Admin</h1><p>Kelola Struktur Organisasi SMAN 15 Bandung</p><input id="email" type="email" placeholder="Email admin" style="width:100%;padding:11px;margin:6px 0;border:1px solid #ccdcd4;border-radius:9px"><input id="pass" type="password" placeholder="Password" style="width:100%;padding:11px;margin:6px 0;border:1px solid #ccdcd4;border-radius:9px"><button class="btn" onclick="login()">Masuk</button><div id="loginmsg" class="small"></div></div><div id="panel" class="hidden"><div class="bar"><div><h1>Editor Struktur</h1><div class="small">Perubahan tersimpan langsung ke Supabase</div></div><button class="btn secondary" onclick="logout()">Keluar</button></div><div id="statusEl" class="status">Memuat…</div><div class="actions"><button class="btn" onclick="saveAll()">💾 Simpan Semua</button><button class="btn secondary" onclick="location.href=location.pathname">👁️ Lihat Struktur</button></div><div id="list" class="panel" style="margin-top:15px"></div></div></div></div>
<script>
// ====== ISI DUA NILAI INI SAJA ======
const SUPABASE_URL='https://ykuvuogfvchdfwdgygsk.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrdXZ1b2dmdmNoZGZ3ZGd5Z3NrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDE2MTgsImV4cCI6MjEwNjcxNzYxOH0.bHT5Fnz8NH7EudlF_Ikb5i6wrNimMoyMY907kwpFNos';
// ====================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function card(x,small=false){const ph=x.photo_url||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22160%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23e6f3ec%22/%3E%3Ctext x=%2250%25%22 y=%2258%25%22 text-anchor=%22middle%22 font-size=%2260%22%3E%F0%9F%91%A4%3C/text%3E%3C/svg%3E';return `<div class="card"><img class="photo" src="${ph}" alt=""><div class="role">${esc(x.role)}</div><div class="name">${esc(x.name||'Belum diisi')}</div></div>`}
async function loadPublic(){const {data,error}=await sb.from('org_members').select('*').eq('active',true).order('sort_order');if(error){document.getElementById('app').innerHTML='<div class="err">Belum terhubung ke Supabase. Periksa SUPABASE_URL dan SUPABASE_ANON_KEY di index.html, dan pastikan schema.sql sudah dijalankan.</div>';return}const by=k=>data.filter(x=>x.group_key===k);const kepala=data.find(x=>x.key==='kepala'),korlas=data.find(x=>x.key==='korlas');let html=`<div id="fit"><div class="chart"><div class="top"><div class="headcard">${card(kepala||{role:'Kepala Sekolah',name:''})}</div><div class="dash"></div><div class="korlas">${card(korlas||{role:'Ketua Korlas',name:''})}</div></div><div class="waka-row">`;['kurikulum','kesiswaan','sarpras','humas','bk'].forEach(g=>{const d=data.find(x=>x.key===g);html+=`<div class="dept">${card(d||{role:g,name:''})}<div class="staff">${by(g).filter(x=>x.parent_key===g).map(x=>card(x,true)).join('')}</div></div>`});html+=`</div><h2 class="wali-title">Wali Kelas</h2><div class="wali">${by('wali').map(x=>card(x,true)).join('')}</div></div></div>`;document.getElementById('app').className='';document.getElementById('app').innerHTML=html;fitChart();setTimeout(fitChart,300)}
function fitChart(){const box=document.getElementById('fit');if(!box)return;const ch=box.firstElementChild;ch.style.transform='none';const s=Math.min(1,box.clientWidth/1200);ch.style.transform=`scale(${s})`;box.style.height=Math.ceil(ch.offsetHeight*s)+'px'}
window.addEventListener('resize',fitChart);window.addEventListener('load',fitChart);


let rows=[];
function msg(t){document.getElementById('loginmsg').textContent=t}
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(error)msg(error.message);else show()}
async function logout(){await sb.auth.signOut();location.reload()}
async function show(){const loginBox=document.getElementById('login');loginBox.classList.add('hidden');document.getElementById('panel').classList.remove('hidden');await load()}
async function load(){const r=await sb.from('org_members').select('*').eq('active',true).order('group_key').order('sort_order');if(r.error){statusEl.textContent=r.error.message;return}rows=r.data;statusEl.textContent=`${rows.length} data aktif`;render()}
function render(){list.innerHTML=rows.map((x,i)=>`<div class="item"><div class="small">Jabatan / Kelas</div><input id="r${i}" type="text" value="${esc(x.role)}" style="width:100%;padding:10px;margin:4px 0 10px;border:1px solid #ccdcd4;border-radius:9px;font-weight:700"><div class="small">Nama</div><div class="row" style="margin-top:4px"><input id="n${i}" type="text" value="${esc(x.name)}"><label class="btn secondary">📷 Foto<input class="file" type="file" accept="image/*" onchange="upload(${i},this)"></label></div><div class="small" style="margin-top:6px">${esc(x.key)} ${x.photo_url?'• foto tersimpan':''}</div></div>`).join('')}
function sync(){for(let k=0;k<rows.length;k++){const n=document.getElementById('n'+k),r=document.getElementById('r'+k);if(n)rows[k].name=n.value;if(r)rows[k].role=r.value}}
function shrink(file,max=600){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Gagal memproses gambar')),'image/jpeg',0.85)};img.onerror=()=>rej(new Error('File bukan gambar valid'));img.src=u})}
async function upload(i,el){const f0=el.files[0];if(!f0)return;statusEl.textContent='Mengunggah foto…';let f;try{f=await shrink(f0)}catch(e){statusEl.textContent=e.message;return}const path=`${rows[i].key}-${Date.now()}.jpg`;const up=await sb.storage.from('org-photos').upload(path,f,{contentType:'image/jpeg'});if(up.error){statusEl.textContent=up.error.message;return}const url=sb.storage.from('org-photos').getPublicUrl(path).data.publicUrl;rows[i].photo_url=url;sync();statusEl.textContent='Foto berhasil diunggah. Klik Simpan Semua.';render()}
async function saveAll(){statusEl.textContent='Menyimpan…';for(let i=0;i<rows.length;i++){rows[i].name=document.getElementById('n'+i).value;rows[i].role=document.getElementById('r'+i).value.trim()||rows[i].role;const u=await sb.from('org_members').update({name:rows[i].name,role:rows[i].role,photo_url:rows[i].photo_url}).eq('id',rows[i].id);if(u.error){statusEl.textContent=u.error.message;return}}statusEl.textContent='✅ Semua perubahan tersimpan';render()}
if(location.hash==='#admin'){document.getElementById('publicView').classList.add('hidden');document.getElementById('adminView').classList.remove('hidden');document.title='Admin Struktur Organisasi';sb.auth.getSession().then(({data})=>{if(data.session)show()})}else{loadPublic()}
window.addEventListener('hashchange',()=>location.reload());
</script></body></html>
