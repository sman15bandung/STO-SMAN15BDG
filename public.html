<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Struktur Organisasi SMAN 15 Bandung</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#f3fbf7,#fff);color:#173b2c}.wrap{padding:28px;overflow:auto}.head{text-align:center;margin-bottom:24px}.head h1{margin:0;font-size:28px}.head p{margin:7px 0;color:#6c8178}.chart{min-width:1100px;position:relative}.top{height:150px;position:relative;display:flex;justify-content:center;align-items:flex-start}.card{background:#fff;border:1px solid #d7e8df;border-radius:18px;box-shadow:0 8px 24px #174b2b14;padding:12px;text-align:center;min-width:160px;position:relative;z-index:2}.photo{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#e6f3ec;margin:auto;border:3px solid #cde6d8}.role{font-size:12px;color:#668077;margin-top:6px}.name{font-weight:800;margin-top:3px}.headcard{position:absolute;left:50%;transform:translateX(-50%);top:0}.korlas{position:absolute;left:calc(50% + 205px);top:30px}.dash{position:absolute;left:calc(50% + 80px);top:72px;width:125px;border-top:2px dashed #7aa890}.waka-row{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;position:relative;padding-top:34px}.waka-row:before{content:"";position:absolute;left:10%;right:10%;top:0;border-top:2px solid #82aa98}.dept{position:relative;text-align:center}.dept:before{content:"";position:absolute;top:-34px;left:50%;height:34px;border-left:2px solid #82aa98}.staff{margin-top:42px;display:flex;flex-direction:column;gap:10px;align-items:center;position:relative}.staff:before{content:"";position:absolute;top:-42px;bottom:-5px;border-left:2px solid #82aa98;z-index:0}.staff .card{width:150px;min-width:150px}.staff .photo{width:52px;height:52px}.wali-title{text-align:center;margin:42px 0 16px}.wali{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.wali .card{min-width:0}.wali .photo{width:52px;height:52px}.loading{text-align:center;padding:60px;color:#6c8178}.err{max-width:700px;margin:40px auto;padding:20px;border-radius:14px;background:#fff1f1;color:#8b3131}
@media(max-width:800px){.wrap{padding:14px}.head h1{font-size:22px}}
</style></head><body><div class="wrap"><div class="head"><h1>STRUKTUR ORGANISASI SMAN 15 BANDUNG</h1><p>Informasi diperbarui secara online</p></div><div id="app" class="loading">Memuat struktur organisasi…</div></div><script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function card(x,small=false){const ph=x.photo_url||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2272%22 height=%2272%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 rx=%2236%22 fill=%22%23e6f3ec%22/%3E%3Ctext x=%2250%25%22 y=%2256%25%22 text-anchor=%22middle%22 font-size=%2230%22%3E%F0%9F%91%A4%3C/text%3E%3C/svg%3E';return `<div class="card"><img class="photo" src="${ph}" alt=""><div class="role">${esc(x.role)}</div><div class="name">${esc(x.name||'Belum diisi')}</div></div>`}
async function load(){const {data,error}=await sb.from('org_members').select('*').eq('active',true).order('sort_order');if(error){document.getElementById('app').innerHTML='<div class="err">Belum terhubung ke Supabase. Periksa config.js dan pastikan schema.sql sudah dijalankan.</div>';return}const by=k=>data.filter(x=>x.group_key===k);const kepala=data.find(x=>x.key==='kepala'),korlas=data.find(x=>x.key==='korlas');let html=`<div class="chart"><div class="top"><div class="headcard">${card(kepala||{role:'Kepala Sekolah',name:''})}</div><div class="dash"></div><div class="korlas">${card(korlas||{role:'Ketua Korlas',name:''})}</div></div><div class="waka-row">`;['kurikulum','kesiswaan','sarpras','humas','bk'].forEach(g=>{const d=data.find(x=>x.key===g);html+=`<div class="dept">${card(d||{role:g,name:''})}<div class="staff">${by(g).filter(x=>x.parent_key===g).map(x=>card(x,true)).join('')}</div></div>`});html+=`</div><h2 class="wali-title">Wali Kelas</h2><div class="wali">${by('wali').map(x=>card(x,true)).join('')}</div></div>`;document.getElementById('app').className='';document.getElementById('app').innerHTML=html}load();
</script></body></html>
