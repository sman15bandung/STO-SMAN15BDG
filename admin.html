<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Struktur Organisasi</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f3faf6;color:#173b2c}.wrap{max-width:1100px;margin:auto;padding:24px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:20px}.panel{background:#fff;border:1px solid #dcebe3;border-radius:18px;padding:20px;box-shadow:0 8px 25px #174b2b12;margin-bottom:18px}h1{margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.item{border:1px solid #e0ebe6;border-radius:14px;padding:14px}.item strong{display:block;margin-bottom:8px}.row{display:flex;gap:8px}.row input[type=text]{flex:1;padding:10px;border:1px solid #ccdcd4;border-radius:9px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#287a55;color:#fff;cursor:pointer;font-weight:700}.btn.secondary{background:#e7f1ec;color:#24563f}.btn.danger{background:#a63d3d}.photo{width:55px;height:55px;object-fit:cover;border-radius:50%;background:#e6f3ec;vertical-align:middle;margin-right:8px}.status{padding:12px;border-radius:10px;background:#edf7f1;margin-bottom:15px}.login{max-width:420px;margin:80px auto}.hidden{display:none}.small{font-size:12px;color:#71857c}.actions{display:flex;gap:8px;flex-wrap:wrap}.file{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><div class="wrap"><div id="login" class="panel login"><h1>🔐 Admin</h1><p>Kelola Struktur Organisasi SMAN 15 Bandung</p><input id="email" type="email" placeholder="Email admin" style="width:100%;padding:11px;margin:6px 0;border:1px solid #ccdcd4;border-radius:9px"><input id="pass" type="password" placeholder="Password" style="width:100%;padding:11px;margin:6px 0;border:1px solid #ccdcd4;border-radius:9px"><button class="btn" onclick="login()">Masuk</button><div id="loginmsg" class="small"></div></div><div id="panel" class="hidden"><div class="bar"><div><h1>Editor Struktur</h1><div class="small">Perubahan tersimpan langsung ke Supabase</div></div><button class="btn secondary" onclick="logout()">Keluar</button></div><div id="statusEl" class="status">Memuat…</div><div class="actions"><button class="btn" onclick="saveAll()">💾 Simpan Semua</button><button class="btn secondary" onclick="location.href='public.html'">👁️ Lihat Struktur</button></div><div id="list" class="panel" style="margin-top:15px"></div></div></div><script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);let rows=[];
function msg(t){document.getElementById('loginmsg').textContent=t}
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(error)msg(error.message);else show()}
async function logout(){await sb.auth.signOut();location.reload()}
async function show(){const loginBox=document.getElementById('login');loginBox.classList.add('hidden');document.getElementById('panel').classList.remove('hidden');await load()}
async function load(){const r=await sb.from('org_members').select('*').eq('active',true).order('group_key').order('sort_order');if(r.error){statusEl.textContent=r.error.message;return}rows=r.data;statusEl.textContent=`${rows.length} data aktif`;render()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){list.innerHTML=rows.map((x,i)=>`<div class="item"><strong>${esc(x.role)}</strong><div class="row"><input id="n${i}" type="text" value="${esc(x.name)}"><label class="btn secondary">📷 Foto<input class="file" type="file" accept="image/*" onchange="upload(${i},this)"></label></div><div class="small">${esc(x.key)} ${x.photo_url?'• foto tersimpan':''}</div></div>`).join('')}
function shrink(file,max=600){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Gagal memproses gambar')),'image/jpeg',0.85)};img.onerror=()=>rej(new Error('File bukan gambar valid'));img.src=u})}
async function upload(i,el){const f0=el.files[0];if(!f0)return;statusEl.textContent='Mengunggah foto…';let f;try{f=await shrink(f0)}catch(e){statusEl.textContent=e.message;return}const path=`${rows[i].key}-${Date.now()}.jpg`;const up=await sb.storage.from('org-photos').upload(path,f,{contentType:'image/jpeg'});if(up.error){statusEl.textContent=up.error.message;return}const url=sb.storage.from('org-photos').getPublicUrl(path).data.publicUrl;rows[i].photo_url=url;for(let k=0;k<rows.length;k++){const n=document.getElementById('n'+k);if(n)rows[k].name=n.value}statusEl.textContent='Foto berhasil diunggah. Klik Simpan Semua.';render()}
async function saveAll(){statusEl.textContent='Menyimpan…';for(let i=0;i<rows.length;i++){rows[i].name=document.getElementById('n'+i).value;const u=await sb.from('org_members').update({name:rows[i].name,photo_url:rows[i].photo_url}).eq('id',rows[i].id);if(u.error){statusEl.textContent=u.error.message;return}}statusEl.textContent='✅ Semua perubahan tersimpan';render()}
sb.auth.getSession().then(({data})=>{if(data.session)show()});
</script></body></html>
